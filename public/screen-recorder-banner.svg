<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="t d">
<title id="t">Screen Recorder</title><desc id="d">Dark promotional illustration of Screen Recorder with display, audio and quality settings.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080f22"/><stop offset=".55" stop-color="#15213e"/><stop offset="1" stop-color="#401d47"/></linearGradient><linearGradient id="button" x2="0" y2="1"><stop stop-color="#68afff"/><stop offset="1" stop-color="#286ce9"/></linearGradient><radialGradient id="glow"><stop stop-color="#b44d8a" stop-opacity=".45"/><stop offset="1" stop-color="#b44d8a" stop-opacity="0"/></radialGradient><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-opacity=".5"/></filter></defs>
<rect width="1600" height="620" fill="url(#bg)"/><circle cx="1370" cy="320" r="490" fill="url(#glow)"/><path d="M0 460 Q390 340 740 535 T1600 510" fill="none" stroke="#e74775" stroke-width="4" opacity=".48"/><path d="M0 515 Q470 400 950 585 T1600 590" fill="none" stroke="#376ccc" stroke-width="2" opacity=".4"/>
<rect x="71" y="139" width="92" height="74" rx="13" fill="#14264c" stroke="#76a7e9" stroke-width="5"/><rect x="84" y="153" width="66" height="47" rx="7" fill="url(#button)"/><circle cx="118" cy="177" r="18" fill="#fa2d52" stroke="#ff89a5" stroke-width="5"/><path d="M116 214 v16 m-26 0 h52" stroke="#bac5db" stroke-width="5" stroke-linecap="round"/>
<text x="189" y="195" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="78" fill="white">Screen <tspan fill="#63b4ff">Recorder</tspan></text>
<text x="77" y="262" font-family="Inter,Arial,sans-serif" font-size="26" fill="#c3cce0">Lightweight GTK screen capture for Linux X11.</text>
<text x="77" y="338" font-family="Inter,Arial,sans-serif" font-size="20" fill="#a1b3d8">DESIGNED FOR CONTROL</text>
<g font-family="Inter,Arial,sans-serif" font-size="23" fill="#eaf0ff"><rect x="75" y="376" width="320" height="68" rx="18" fill="#111b31" stroke="#385074"/><text x="102" y="419">▣  Region or display</text><rect x="414" y="376" width="311" height="68" rx="18" fill="#111b31" stroke="#385074"/><text x="437" y="419">◉  System + mic audio</text><rect x="75" y="462" width="320" height="68" rx="18" fill="#111b31" stroke="#385074"/><text x="102" y="505">⚙  Saved preferences</text><rect x="414" y="462" width="311" height="68" rx="18" fill="#111b31" stroke="#385074"/><text x="437" y="505">●  Native notifications</text></g>
