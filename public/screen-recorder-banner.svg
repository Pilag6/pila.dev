<g font-family="Inter,Arial,sans-serif" fill="#f2f4fa"><text x="866" y="151" font-size="19" font-weight="700">Screen source</text><text x="896" y="188" font-size="18">Select region</text><circle cx="879" cy="181" r="9" stroke="#747785" fill="#46474c"/><circle cx="1174" cy="181" r="9" fill="#468fff"/><circle cx="1174" cy="181" r="3" fill="white"/><text x="1191" y="188" font-size="18">Display 1 (eDP)</text><text x="866" y="245" font-size="19" font-weight="700">Audio source</text><circle cx="879" cy="277" r="9" fill="#48494e" stroke="#72747c"/><text x="896" y="284" font-size="18">No audio</text><circle cx="1174" cy="277" r="9" fill="#468fff"/><circle cx="1174" cy="277" r="3" fill="white"/><text x="1191" y="284" font-size="18">System audio</text><text x="866" y="342" font-size="19" font-weight="700">Frame rate</text><text x="1170" y="342" font-size="19" font-weight="700">Quality</text><circle cx="879" cy="370" r="9" fill="#468fff"/><circle cx="879" cy="370" r="3" fill="white"/><text x="896" y="376" font-size="18">30 FPS</text><circle cx="1174" cy="370" r="9" fill="#468fff"/><circle cx="1174" cy="370" r="3" fill="white"/><text x="1191" y="376" font-size="18">High</text><path d="M866 408 H1487" stroke="#50515c"/><text x="866" y="444" font-size="19" font-weight="700">Status</text><text x="866" y="477" font-size="18" fill="#bfcadd">Ready to record</text><rect x="858" y="504" width="638" height="48" rx="12" fill="url(#button)"/><text x="1111" y="535" font-size="21" font-weight="700" fill="white">Start Recording</text></g></g>
