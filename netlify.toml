[build.environment]
NODE_VERSION = "24.15.0"

[[redirects]]
from = "/textos"
to = "https://pilablog.netlify.app/"
status = 200
force = true

[[redirects]]
from = "/textos/*"
to = "https://pilablog.netlify.app/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
